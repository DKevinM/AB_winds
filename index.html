<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AB Wind (Leaflet)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; background: #1b1f24; }
    .panel {
      position: absolute; top: 10px; left: 60px; z-index: 999;
      background: rgba(0,0,0,0.75); color: #fff;
      font: 14px/1.35 Arial, sans-serif; padding: 8px 12px; border-radius: 6px;
      max-width: 380px;
    }
    .panel b { color: #9fd3ff; }
    .panel input[type=range] { width: 100%; margin: 6px 0 2px; }
    .panel .row { display: flex; justify-content: space-between; font-size: 12px; color: #ccc; }
    .panel button { font-size: 12px; margin-top: 4px; cursor: pointer; }
    .legend { margin-top: 6px; display: flex; gap: 6px; font-size: 11px; color: #ddd; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 3px; }
    .legend i { width: 14px; height: 3px; display: inline-block; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel" id="panel">
    <div id="status">Loading wind…</div>
    <input id="slider" type="range" min="0" max="0" step="1" value="0" disabled />
    <div class="row"><span id="sliderLabel"></span><button id="nowBtn" disabled>Now</button></div>
    <div class="legend" id="legend"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script>
  // HRDPS 10 m wind, stored by AB_winds/py/ab_met_pull.py on a regular north-up
  // lat/lon grid with earth-relative u (east) / v (north) - grid_version 2.
  // Files written before 2026-10-13 had the rotated-grid layout and were
  // re-processed; a file without meta.grid_version is refused below.

  const SUPABASE_URL = "https://zcunoncbyitfsilrhymv.supabase.co";
  const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjdW5vbmNieWl0ZnNpbHJoeW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE3Mjk3NDYsImV4cCI6MjA2NzMwNTc0Nn0._z_tqm_5UIBkWfMa7HAJrUOA-0t9vOaBVV48-74esWQ";
  const TZ = "America/Edmonton";
  const HOUR = 3600e3;

  const map = L.map("map", { zoomControl: true }).setView([55, -115], 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  // ---------- airshed outlines ----------
  const overlays = {};
  Promise.all([
    ["data/ACA.geojson", "#ffcc00", "ACA Airshed"],
    ["data/WCAS.geojson", "#00ffff", "WCAS Airshed"]
  ].map(([url, color, name]) => fetch(url).then(r => r.json()).then(gj => {
    overlays[name] = L.geoJSON(gj, { style: { color, weight: 3, opacity: 1, fillOpacity: 0, dashArray: "6 3" },
                                     interactive: false }).addTo(map);
  }))).then(() => L.control.layers(null, overlays, { collapsed: false }).addTo(map));

  // ---------- time formatting ----------
  const fmtLocal = t => new Date(t).toLocaleString("en-CA", {
    timeZone: TZ, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
  });
  const fmtUTC = t => new Date(t).toISOString().slice(0, 16).replace("T", " ") + " UTC";

  // ---------- data: catalogue + lazily loaded snapshots ----------
  async function sb(path) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: API_KEY, Authorization: `Bearer ${API_KEY}` } });
    if (!r.ok) throw new Error(`Supabase ${r.status}`);
    return r.json();
  }

  // One entry per valid time: the newest run that has it.
  async function loadCatalogue() {
    const from = new Date(Date.now() - 6 * HOUR).toISOString();
    const rows = await sb(`wind_files?select=run_time,forecast_hour,valid_time,file_path` +
                          `&model=eq.HRDPS&valid_time=gte.${from}&order=valid_time.asc,run_time.desc&limit=500`);
    const byValid = new Map();
    for (const r of rows) {
      const t = Date.parse(r.valid_time);
      if (!byValid.has(t)) byValid.set(t, { t, run: Date.parse(r.run_time), lead: r.forecast_hour, path: r.file_path });
    }
    return [...byValid.values()].sort((a, b) => a.t - b.t);
  }

  const snapCache = new Map();   // file_path -> Promise<snapshot>
  function loadSnapshot(entry) {
    if (!snapCache.has(entry.path)) {
      snapCache.set(entry.path, (async () => {
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/winds/${entry.path}`);
        if (!res.ok) throw new Error(`wind file ${res.status}`);
        const bytes = new Uint8Array(await res.arrayBuffer());
        const text = (bytes[0] === 0x1f && bytes[1] === 0x8b) ? pako.inflate(bytes, { to: "string" })
                                                              : new TextDecoder().decode(bytes);
        const d = JSON.parse(text);
        if (!d.meta || !d.meta.grid_version) throw new Error("old-layout wind file (pre grid_version 2) - refusing to draw it");
        const g = d.grid, n = g.nx * g.ny;
        const flat = rows => { const a = new Float32Array(n); let k = 0;
          for (const row of rows) for (const x of row) a[k++] = (x === null ? NaN : x); return a; };
        return { ...entry, grid: g, u: flat(d.fields.ugrd10[0]), v: flat(d.fields.vgrd10[0]) };
      })());
      snapCache.get(entry.path).catch(() => snapCache.delete(entry.path));
    }
    return snapCache.get(entry.path);
  }

  // Bilinear sample of one snapshot - same index convention as every other reader:
  // i = (lon - lo1) / dx, j = (la1 - lat) / dy.
  function sampleSnap(s, lat, lon) {
    const g = s.grid, fi = (lon - g.lo1) / g.dx, fj = (g.la1 - lat) / g.dy;
    if (!(fi >= 0 && fj >= 0 && fi < g.nx - 1 && fj < g.ny - 1)) return null;
    const i = fi | 0, j = fj | 0, di = fi - i, dj = fj - j, k = j * g.nx + i;
    const bl = a => a[k] * (1 - di) * (1 - dj) + a[k + 1] * di * (1 - dj) + a[k + g.nx] * (1 - di) * dj + a[k + g.nx + 1] * di * dj;
    const u = bl(s.u), v = bl(s.v);
    return (isFinite(u) && isFinite(v)) ? { u, v } : null;
  }

  // The field actually drawn: two snapshots bracketing the chosen time, blended by real time.
  let field = null;
  function makeField(a, b, t) {
    const w = (b && b.t > a.t) ? Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))) : 0;
    return {
      t, a, b, w,
      sample(lat, lon) {
        const x = sampleSnap(a, lat, lon);
        if (!b || w === 0) return x;
        const y = sampleSnap(b, lat, lon);
        if (!x || !y) return x || y;
        return { u: x.u * (1 - w) + y.u * w, v: x.v * (1 - w) + y.v * w };
      }
    };
  }

  // ---------- particle layer ----------
  // Particles live in lat/lon; drawing projects them each frame. The canvas is
  // re-anchored to the map's top-left corner on every moveend/zoomend and hidden
  // during zoom animation (leaflet-zoom-hide), so it can never drift off the basemap.
  const SPEED_BINS = [   // m/s upper bound -> colour
    // dark, saturated colours: must read against OSM's pale land AND green forest
    [2, "#1e3a8a"], [4, "#2563eb"], [7, "#7c3aed"], [10, "#c026d3"], [14, "#ea580c"], [Infinity, "#dc2626"]
  ];
  const PX_PER_MS = 0.45;      // screen pixels moved per frame per m/s: same look at every zoom
  const MAX_AGE = 70;          // frames

  const WindLayer = L.Layer.extend({
    onAdd(m) {
      this._map = m;
      this._canvas = L.DomUtil.create("canvas", "leaflet-zoom-hide");
      this._canvas.style.pointerEvents = "none";
      m.getPanes().overlayPane.appendChild(this._canvas);
      this._ctx = this._canvas.getContext("2d");
      m.on("movestart zoomstart", this._pause, this);
      m.on("moveend zoomend resize", this._reset, this);
      this._reset();
    },
    onRemove(m) {
      m.off("movestart zoomstart", this._pause, this);
      m.off("moveend zoomend resize", this._reset, this);
      cancelAnimationFrame(this._raf);
      this._canvas.remove();
    },
    _pause() {
      cancelAnimationFrame(this._raf); this._raf = null;
      this._ctx.clearRect(0, 0, this._canvas.width, this._canvas.height);
    },
    _reset() {
      const m = this._map, size = m.getSize(), dpr = window.devicePixelRatio || 1;
      this._origin = m.containerPointToLayerPoint([0, 0]);
      L.DomUtil.setPosition(this._canvas, this._origin);
      this._canvas.width = size.x * dpr; this._canvas.height = size.y * dpr;
      this._canvas.style.width = size.x + "px"; this._canvas.style.height = size.y + "px";
      this._ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this._w = size.x; this._h = size.y;
      const n = Math.min(4500, Math.round(size.x * size.y / 260));
      this._particles = Array.from({ length: n }, () => this._spawn(true));
      if (!this._raf) this._loop();
    },
    _spawn(randomAge) {
      // uniformly over the VISIBLE map, so zooming in never starves the view
      const ll = this._map.containerPointToLatLng([Math.random() * this._w, Math.random() * this._h]);
      return { lat: ll.lat, lng: ll.lng, age: randomAge ? (Math.random() * MAX_AGE) | 0 : 0 };
    },
    _loop() {
      this._raf = requestAnimationFrame(() => this._loop());
      if (!field) return;
      const ctx = this._ctx, m = this._map;
      // fade trails
      ctx.globalCompositeOperation = "destination-in";
      ctx.fillStyle = "rgba(0,0,0,0.93)";
      ctx.fillRect(0, 0, this._w, this._h);
      ctx.globalCompositeOperation = "source-over";
      const paths = SPEED_BINS.map(() => new Path2D());
      for (let p of this._particles) {
        if (++p.age > MAX_AGE) { Object.assign(p, this._spawn(false)); continue; }
        const wv = field.sample(p.lat, p.lng);
        if (!wv) { Object.assign(p, this._spawn(false)); continue; }
        const a = m.latLngToContainerPoint([p.lat, p.lng]);
        // earth-relative wind on a conformal (Web Mercator) map: east = +x, north = -y
        const bx = a.x + wv.u * PX_PER_MS, by = a.y - wv.v * PX_PER_MS;
        const ll = m.containerPointToLatLng([bx, by]);
        p.lat = ll.lat; p.lng = ll.lng;
        if (bx < 0 || by < 0 || bx > this._w || by > this._h) { Object.assign(p, this._spawn(false)); continue; }
        const s = Math.hypot(wv.u, wv.v);
        let bin = 0; while (s > SPEED_BINS[bin][0]) bin++;
        paths[bin].moveTo(a.x, a.y); paths[bin].lineTo(bx, by);
      }
      ctx.lineWidth = 2; ctx.lineCap = "round";
      paths.forEach((pth, i) => { ctx.strokeStyle = SPEED_BINS[i][1]; ctx.stroke(pth); });
    }
  });
  const windLayer = new WindLayer().addTo(map);

  document.getElementById("legend").innerHTML = SPEED_BINS.map(([hi, c], i) => {
    const lo = i ? SPEED_BINS[i - 1][0] : 0;
    const lbl = hi === Infinity ? `${Math.round(lo * 3.6)}+ km/h` : `${Math.round(lo * 3.6)}–${Math.round(hi * 3.6)}`;
    return `<span><i style="background:${c}"></i>${lbl}</span>`;
  }).join("");

  // ---------- time control ----------
  let catalogue = [], hours = [];     // hours: selectable times (ms), hourly from now to the last forecast
  const slider = document.getElementById("slider"), nowBtn = document.getElementById("nowBtn");
  const statusEl = document.getElementById("status"), sliderLabel = document.getElementById("sliderLabel");
  let following = true;               // "Now" mode: keep tracking the clock

  async function showTime(t) {
    let i = catalogue.findIndex(e => e.t > t);
    if (i === -1) i = catalogue.length;
    const a = catalogue[Math.max(0, i - 1)], b = catalogue[Math.min(catalogue.length - 1, i)];
    statusEl.innerHTML = "Loading wind…";
    const [sa, sb2] = await Promise.all([loadSnapshot(a), loadSnapshot(b)]);
    field = makeField(sa, sb2, t);
    const src = field.w < 0.5 ? sa : sb2;
    statusEl.innerHTML =
      `<b>10 m wind valid ${fmtLocal(t)}</b> (${fmtUTC(t)})<br>` +
      `HRDPS ${fmtUTC(src.run).slice(11)} run, ` +
      `${a === b ? `+${a.lead} h` : `blended +${a.lead} h → +${b.lead} h`} ` +
      `(issued ${fmtLocal(src.run)})`;
    sliderLabel.textContent = following ? "Now" : fmtLocal(t);
  }

  async function refresh() {
    try {
      catalogue = await loadCatalogue();
      if (!catalogue.length) throw new Error("no wind files in the catalogue");
      const now = Date.now(), first = Math.ceil(now / HOUR) * HOUR, last = catalogue[catalogue.length - 1].t;
      hours = [now];
      for (let t = first; t <= last; t += HOUR) hours.push(t);
      slider.max = hours.length - 1; slider.disabled = false; nowBtn.disabled = false;
      if (following) { slider.value = 0; await showTime(now); }
    } catch (e) {
      statusEl.innerHTML = `<b style="color:#ff8080">Wind unavailable:</b> ${e.message}`;
      console.error(e);
    }
  }

  slider.addEventListener("input", () => {
    following = Number(slider.value) === 0;
    showTime(following ? Date.now() : hours[Number(slider.value)]);
  });
  nowBtn.addEventListener("click", () => { following = true; slider.value = 0; showTime(Date.now()); });

  refresh();
  setInterval(refresh, 10 * 60e3);                       // new runs arrive every few hours
  setInterval(() => { if (following && catalogue.length) showTime(Date.now()); }, 60e3);

  // ---------- click for the value under the cursor ----------
  const compass = d => ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round(d / 22.5) % 16];
  map.on("click", e => {
    if (!field) return;
    const w = field.sample(e.latlng.lat, e.latlng.lng);
    const html = !w ? "No wind data at this location" : (() => {
      const spd = Math.hypot(w.u, w.v), from = (270 - Math.atan2(w.v, w.u) * 180 / Math.PI + 360) % 360;
      return `<b>Wind from ${compass(from)} (${from.toFixed(0)}°)</b><br>` +
             `${(spd * 3.6).toFixed(0)} km/h (${spd.toFixed(1)} m/s)<br>` +
             `<span style="color:#666">HRDPS model, 10 m, valid ${fmtLocal(field.t)}</span>`;
    })();
    L.popup().setLatLng(e.latlng).setContent(html).openOn(map);
  });
  </script>
</body>
</html>
