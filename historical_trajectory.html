<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Odour Index — Back Trajectory Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="odour/data.js"></script>
  <script src="js/windrose.js"></script>

  <style>
    body { margin: 0; font-family: Arial; background: #111; color: #eee; }
    #map { height: 80vh; }
    #panel {
      padding: 10px;
      background: #1b1b1b;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input, button {
      padding: 6px;
      font-size: 14px;
    }

    #windRosePanel {
      display: none;
      position: absolute;
      bottom: 20px;
      right: 10px;
      z-index: 1000;
      background: rgba(20,20,20,0.85);
      color: #eee;
      padding: 8px 10px 6px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }
    #windRosePanel.active { display: block; }
  </style>
</head>

<body>

<div id="panel">
  <b>Odour Index</b>
  Time (local - Alberta, auto-converted to UTC):
  <input id="time" type="datetime-local">
  Hours:
  <input id="hours" type="number" value="4" min="1" max="12">
  <span style="font-size:12px; color:#aaa;">
    Alberta time; the model converts it to UTC
  </span>  
  <button onclick="runModel()">Run Odour Model</button>
  <span id="status"></span>
</div>

<div id="map"></div>
<div id="windRosePanel"></div>

<script>

let selectedPoint = null;
let trajectoryPoll = null;
let modelStartTime = null;

// MAP SETUP
const map = L.map('map').setView([53.54, -113.49], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18
}).addTo(map);



// LAYERS
const stationsLayer = L.layerGroup().addTo(map);
const purpleLayer = L.layerGroup().addTo(map);
const npriLayer = L.layerGroup().addTo(map);
  
// Separate layer group per start height for the centerline, so each
// height can be switched on/off independently. Individual particle
// positions are intentionally not rendered - the ensemble is represented
// by the centerline (path) and the density grid (where the ensemble
// spent its time), not by plotting every particle's position.
const centerline10Layer = L.layerGroup().addTo(map);
const centerline40Layer = L.layerGroup().addTo(map);
const centerline80Layer = L.layerGroup().addTo(map);
// Off by default while trying a thicker centerline instead - still
// toggleable via the layer control for comparison.
const densityLayer = L.layerGroup();

const CENTERLINE_LAYERS = { 10: centerline10Layer, 40: centerline40Layer, 80: centerline80Layer };

const overlayMaps = {
  "Stations": stationsLayer,
  "PurpleAir": purpleLayer,
  "NPRI": npriLayer,
  "Trajectory 10m (line)": centerline10Layer,
  "Trajectory 40m (line)": centerline40Layer,
  "Trajectory 80m (line)": centerline80Layer,
  "Back Trajectory Density": densityLayer
};

L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

// Trajectory start-height colors (must match backtraj_core.py's
// start_heights_m = (10.0, 40.0, 80.0))
const HEIGHT_COLORS = {
  10: "#00e5ff",
  40: "#66bb6a",
  80: "#e91e63"
};
const DEFAULT_HEIGHT_COLOR = "#999999";
function colorForHeight(z0) {
  return HEIGHT_COLORS[Math.round(Number(z0))] || DEFAULT_HEIGHT_COLOR;
}

const heightLegend = L.control({ position: "bottomleft" });
heightLegend.onAdd = function () {
  const div = L.DomUtil.create("div", "info legend");
  div.style.background = "white";
  div.style.padding = "6px 8px";
  div.style.borderRadius = "4px";
  div.style.boxShadow = "0 1px 4px rgba(0,0,0,0.4)";
  div.style.fontSize = "12px";
  div.style.lineHeight = "1.4";
  div.style.color = "#111";
  div.innerHTML = "<strong>Trajectory start height</strong><br>" +
    Object.entries(HEIGHT_COLORS).map(([z0, color]) =>
      `<span style="display:inline-block;width:10px;height:10px;background:${color};margin-right:5px;border:1px solid #111;"></span>${z0} m`
    ).join("<br>");
  return div;
};
heightLegend.addTo(map);


  
  
function getColor(aqhi) {
  const lut = {
    "1":  "#01cbff",
    "2":  "#0099cb",
    "3":  "#016797",
    "4":  "#fffe03",
    "5":  "#ffcb00",
    "6":  "#ff9835",
    "7":  "#fd6866",
    "8":  "#fe0002",
    "9":  "#cc0001",
    "10": "#9a0100",
    "10+": "#640100"
  };
  return lut[String(aqhi)] || "#D3D3D3";
}  

  
// =============================
// STATIONS (GeoJSON)
// =============================
window.dataReady
  .then(() => fetchAllStationData())
  .then(allStations => {
    allStations.forEach(({ stationName, lat, lon, html, aqhi }) => {
      const fillColor = getColor(String(aqhi || "NA"));

      const popupContent = html || `
        <b>${stationName || "Station"}</b><br>
        AQHI: ${aqhi ?? "NA"}<br>
        <hr>
           href="https://dkevinm.github.io/AB_datapull/web/station_compare.html?station=${encodeURIComponent(stationName)}"
           target="_blank">
           View historical data
        </a>
      `;

      const marker = L.circleMarker([lat, lon], {
        radius: 7,
        fillColor: fillColor,
        color: "#222",
        weight: 1,
        fillOpacity: 0.85
      });

      marker.bindPopup(popupContent);
      marker.addTo(stationsLayer);
    });
  })
  .catch(err => console.error("Stations load failed", err));



// =============================
// PURPLEAIR
// =============================
fetch("https://DKevinM.github.io/AB_datapull/data/AB_PM25_map.json")
  .then(r => r.json())
  .then(data => {
    data.forEach(s => {
      const lat = parseFloat(s.latitude ?? s.lat);
      const lon = parseFloat(s.longitude ?? s.lon);
      if (!isFinite(lat) || !isFinite(lon)) return;

      const sensorIndex = s.sensor_index ?? "NA";
      const label = s.name ?? s.sensor_index ?? "PurpleAir Sensor";

      const marker = L.circleMarker([lat, lon], {
        radius: 4,
        color: "#8000ff",
        fillOpacity: 0.6
      });

      marker.bindPopup(`
        <strong>PurpleAir</strong><br>
        <b>${label}</b><br>
        Sensor index: ${sensorIndex}<br>
        <hr>
        <a href="https://dkevinm.github.io/AB_datapull/web/sensor_compare.html?sensor_index=${sensorIndex}"
           target="_blank">
           View historical PM2.5
        </a>
      `);

      marker.addTo(purpleLayer);
    });
  })
  .catch(err => console.error("PurpleAir load failed", err));

  
// =============================
// NPRI - live from ECCC's own ArcGIS service, not the stale static
// export this used to read (unchanged since 2026-07-18, had 2-4
// duplicate rows per facility). Paginated since the server caps
// ~2000 records/request.
// =============================
async function fetchNpriLive() {
  const base = "https://maps-cartes.ec.gc.ca/arcgis/rest/services/STB_DGST/NPRI/MapServer/0/query";
  const fields = "FacilityName,CompanyName,ProvinceCode,ReportYear,NpriID,SectorDescriptionEn,City";
  let allFeatures = [];
  let offset = 0;
  const pageSize = 2000;
  while (true) {
    const url = `${base}?where=ProvinceCode%3D%27AB%27&outFields=${fields}&f=geojson&resultRecordCount=${pageSize}&resultOffset=${offset}`;
    const res = await fetch(url);
    if (!res.ok) { console.error("NPRI live fetch failed:", res.status); break; }
    const page = await res.json();
    const feats = page.features || [];
    allFeatures = allFeatures.concat(feats);
    if (feats.length < pageSize) break;
    offset += pageSize;
  }
  return { type: "FeatureCollection", features: allFeatures };
}

fetchNpriLive()
  .then(fc => {
    L.geoJSON(fc, {
      pointToLayer: (f, latlng) => {
        const marker = L.circleMarker(latlng, {
          radius: 4,
          color: "#ff0000",
          fillOpacity: 0.7
        });

        const facilityName =
          f.properties?.FacilityName ||
          f.properties?.FACILITY_NAME ||
          "NPRI Facility";

        const companyName =
          f.properties?.CompanyName ||
          f.properties?.COMPANY_NAME ||
          "";

        const yr =
          f.properties?.ReportYear ||
          f.properties?.REPORTING_YEAR ||
          "";

        const popupLabel = companyName
          ? `${facilityName} (${companyName})`
          : facilityName;

        marker.bindPopup(`
          <b>${popupLabel}</b><br>
          ${yr ? `Year: ${yr}<br>` : ""}
          <small>${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}</small>
        `);

        return marker;
      }
    }).addTo(npriLayer);
  })
  .catch(err => console.error("NPRI load failed", err));




  


  
// CLICK LOCATION
let marker;
map.on('click', e => {
  selectedPoint = e.latlng;
  if (marker) map.removeLayer(marker);
  marker = L.marker(e.latlng).addTo(map);
});

// ----------------------------
// CHECK FOR NEW OUTPUT
// ----------------------------
async function checkForNewOutput() {
  try {
    const res = await fetch(
      "odour_data/backtraj_centerlines.geojson?t=" + Date.now(),
      { method: "HEAD" }
    );

    if (!res.ok) return false;

    const lastModified = res.headers.get("Last-Modified");
    if (!lastModified) return false;

    const fileTime = new Date(lastModified).getTime();

    return fileTime > modelStartTime;

  } catch {
    return false;
  }
}

// ----------------------------
// LOAD TRAJECTORIES
// ----------------------------
async function loadTrajectories() {

  const [centerRes, densityRes, windRes] = await Promise.all([
    fetch("odour_data/backtraj_centerlines.geojson?t=" + Date.now()),
    fetch("odour_data/backtraj_density.geojson?t=" + Date.now()),
    fetch("odour_data/backtraj_windseries.json?t=" + Date.now())
  ]);

  if (!centerRes.ok || !densityRes.ok) return false;

  const centerGeo = await centerRes.json();
  const densityGeo = await densityRes.json();

  // GitHub Pages' CDN has multiple edge nodes; the HEAD request in
  // checkForNewOutput() can see a fresh Last-Modified from one node while
  // this GET lands on another node still serving pre-run (empty) content.
  // Don't trust the timestamp alone - only accept a result that actually
  // has trajectory data, otherwise keep polling.
  if (!centerGeo.features || centerGeo.features.length === 0) {
    return false;
  }

  // A stale CDN edge node can also serve a *previous* completed run's
  // full (non-empty) data instead of this run's - the length check above
  // wouldn't catch that. Confirm the returned trajectory actually starts
  // where we clicked before accepting it as this run's result.
  if (selectedPoint) {
    const [startLon, startLat] = centerGeo.features[0].geometry.coordinates[0];
    const drift = Math.hypot(startLat - selectedPoint.lat, startLon - selectedPoint.lng);
    if (drift > 0.01) {
      return false;
    }
  }

  // Non-fatal: older runs (before this feature shipped) won't have this
  // file, and a missing wind rose shouldn't block the trajectory itself.
  if (windRes.ok) {
    try {
      const windSeries = await windRes.json();
      buildWindRose("windRosePanel", windSeries);
      document.getElementById("windRosePanel").classList.add("active");
    } catch (err) {
      console.warn("Wind rose data unavailable", err);
    }
  }

  Object.values(CENTERLINE_LAYERS).forEach(l => l.clearLayers());
  densityLayer.clearLayers();

  // CENTERLINE, split per start height so each can be switched on/off
  // independently.
  [10, 40, 80].forEach(z0 => {

    L.geoJSON(centerGeo, {
      filter: feature => Math.round(feature.properties?.z0_m) === z0,
      style: { color: colorForHeight(z0), weight: 9, opacity: 0.7 },
      onEachFeature: (feature, layer) => {
        layer.bindTooltip(`Back trajectory<br>Start height: ${z0} m`, {
          sticky: true
        });
      }
    }).addTo(CENTERLINE_LAYERS[z0]);
  });

  // DENSITY - density_frac is each cell's share of total particle-time
  // samples for the whole run (invariant to particle count/duration/
  // recording stride, unlike a raw count). Opacity is scaled relative to
  // the busiest cell in *this* run so the map always reads as a clean
  // heatmap regardless of run settings, while density_frac itself stays
  // comparable across different runs.
  const maxDensityFrac = Math.max(
    0.000001,
    ...densityGeo.features.map(f => f.properties?.density_frac ?? 0)
  );

  L.geoJSON(densityGeo, {
    style: f => ({
      color: "#333",
      weight: 0.3,
      fillColor: "#ff7f00",
      fillOpacity: 0.8 * (f.properties.density_frac ?? 0) / maxDensityFrac
    }),
    onEachFeature: (feature, layer) => {
      const pct = ((feature.properties?.density_frac ?? 0) * 100).toFixed(2);
      layer.bindTooltip(`Trajectory density<br>${pct}% of ensemble time`, {
        sticky: true
      });
    }
  }).addTo(densityLayer);

  return true;
}

// ----------------------------
// START POLLING
// ----------------------------
function startPolling() {

  if (trajectoryPoll) clearInterval(trajectoryPoll);

  document.getElementById("status").innerText =
    "Model running — checking for results every 2 minutes...";

  trajectoryPoll = setInterval(async () => {

    const ready = await checkForNewOutput();

    if (ready) {
      const loaded = await loadTrajectories();

      if (loaded) {
        clearInterval(trajectoryPoll);

        document.getElementById("status").innerText =
          "Trajectory loaded";
      }
      // else: HEAD said ready but the GET raced a stale CDN edge node -
      // keep polling, next cycle will pick up the fully-propagated data.
    }

  }, 120000);
}

// ----------------------------
// RUN MODEL (KEY FUNCTION)
// ----------------------------
async function runModel() {

  if (!selectedPoint) {
    alert("Click on the map first.");
    return;
  }

  const time = document.getElementById("time").value;
  console.log("Local Alberta time sent to model:", time);
  const hours = document.getElementById("hours").value;

  if (!time) {
    alert("Enter a local time");
    return;
  }

  modelStartTime = Date.now();

  document.getElementById("status").innerText =
    "Triggering Python model...";

const res = await fetch(
  "https://dawn-dew-c0e8.kevinmcc.workers.dev/",
  {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      lat: selectedPoint.lat,
      lon: selectedPoint.lng,
      time_local: time,
      timezone: "America/Edmonton",
      hours: Number(hours)
    })
  }
);

const txt = await res.text();
console.log("API RESPONSE:", txt);

document.getElementById("status").innerText =
  "Response: " + txt;

startPolling();
}

</script>

</body>
</html>
