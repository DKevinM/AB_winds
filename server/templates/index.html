<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AB_winds Back-Trajectory (live)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;background:#0f1720;color:#f4f7fa;font-family:Arial}
header{max-width:1100px;margin:auto;padding:16px 20px}
#map{height:70vh;width:100%}
#panel{max-width:1100px;margin:auto;padding:14px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:#172330}
.field{display:flex;flex-direction:column;font-size:12px;color:#9fb0bf}
input{background:#111c26;border:1px solid #304152;color:#f4f7fa;padding:8px;border-radius:6px;font-size:14px}
button{background:#4dabf7;color:#0f1720;border:none;padding:10px 18px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{background:#304152;color:#9fb0bf}
.hint{color:#9fb0bf;font-size:13px;max-width:1100px;margin:auto;padding:0 20px}
#status{max-width:1100px;margin:auto;padding:10px 20px;font-size:14px}
.status-running{color:#e0a800}
.status-failed{color:#e8590c}
.status-completed{color:#2f9e44}
.leaflet-container{background:#111c26}
</style></head><body>
<header><h1>AB_winds Back-Trajectory (live)</h1></header>
<p class="hint">Click the map to set a point (or type lat/lon), pick a local Alberta date/time and lookback window, then run. Uses real HRDPS wind-field data and a particle simulation — typically takes ~2-3 minutes.</p>
<div id="panel">
  <div class="field">Latitude<input id="lat" type="number" step="0.0001" value="53.5461"></div>
  <div class="field">Longitude<input id="lon" type="number" step="0.0001" value="-113.4938"></div>
  <div class="field">Local date/time<input id="time_local" type="datetime-local"></div>
  <div class="field">Lookback hours<input id="hours" type="number" step="1" min="1" max="48" value="6"></div>
  <button id="runbtn" onclick="runModel()">Run back-trajectory</button>
</div>
<div id="status"></div>
<div id="map"></div>
<script>
var map=L.map('map').setView([53.9,-114.5],6);
var osmLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
__CARTO_DARK_LAYER_JS__
L.control.layers(__CARTO_BASE_LAYERS__,null,{collapsed:true}).addTo(map);
var marker=null,resultLayer=null,pollTimer=null;
map.on('click',function(e){
  document.getElementById('lat').value=e.latlng.lat.toFixed(5);
  document.getElementById('lon').value=e.latlng.lng.toFixed(5);
  placeMarker(e.latlng.lat,e.latlng.lng);
});
function placeMarker(lat,lon){
  if(marker)map.removeLayer(marker);
  marker=L.circleMarker([lat,lon],{radius:8,color:'#fff',weight:2,fillColor:'#4dabf7',fillOpacity:1}).addTo(map);
}
(function(){
  var now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  document.getElementById('time_local').value=now.toISOString().slice(0,16);
  placeMarker(53.5461,-113.4938);
})();
function setStatus(text,cls){
  var el=document.getElementById('status');
  el.textContent=text; el.className=cls||'';
}
function runModel(){
  var lat=parseFloat(document.getElementById('lat').value);
  var lon=parseFloat(document.getElementById('lon').value);
  var timeLocal=document.getElementById('time_local').value;
  var hours=parseFloat(document.getElementById('hours').value);
  if(!timeLocal){alert('Pick a date/time.');return;}
  var btn=document.getElementById('runbtn');
  btn.disabled=true;btn.textContent='Running...';
  setStatus('Submitting...','');
  if(resultLayer){map.removeLayer(resultLayer);resultLayer=null;}
  var params=new URLSearchParams({lat:lat,lon:lon,time_local:timeLocal+':00',hours:hours});
  fetch('/run?'+params.toString(),{method:'POST'})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.error){setStatus('Error: '+data.error,'status-failed');btn.disabled=false;btn.textContent='Run back-trajectory';return;}
      poll(data.job_id);
    })
    .catch(function(err){setStatus('Request failed: '+err,'status-failed');btn.disabled=false;btn.textContent='Run back-trajectory';});
}
function poll(jobId){
  fetch('/status/'+jobId).then(function(r){return r.json();}).then(function(job){
    var btn=document.getElementById('runbtn');
    if(job.status==='pending'||job.status==='running'){
      setStatus('Status: '+job.status+' (usually ~2-3 minutes)...','status-running');
      pollTimer=setTimeout(function(){poll(jobId);},5000);
    }else if(job.status==='completed'){
      setStatus('Completed.','status-completed');
      btn.disabled=false;btn.textContent='Run back-trajectory';
      renderResult(job.result);
    }else if(job.status==='failed'){
      setStatus('Failed: '+(job.error||'unknown error'),'status-failed');
      btn.disabled=false;btn.textContent='Run back-trajectory';
    }
  }).catch(function(err){setStatus('Status check failed: '+err,'status-failed');});
}
function colorForDensity(x){if(x==null)return '#6c757d';if(x<50)return '#3d5a80cc';if(x<150)return '#5390d9';if(x<300)return '#48cae4';return '#ade8f4';}
function renderResult(result){
  var group=L.layerGroup();
  if(result.backtraj_density){
    L.geoJSON(result.backtraj_density,{style:function(f){return {fillColor:colorForDensity(f.properties.count),color:'transparent',fillOpacity:0.4};},onEachFeature:function(f,l){l.bindPopup('Modeled air parcel density<br>count: '+f.properties.count);}}).addTo(group);
  }
  if(result.backtraj_centerlines){
    L.geoJSON(result.backtraj_centerlines,{style:function(){return {color:'#ade8f4',weight:2,dashArray:'6,4'};}}).addTo(group);
  }
  group.addTo(map);
  resultLayer=group;
  var b=group.getBounds();
  if(b.isValid())map.fitBounds(b.pad(0.2));
}
</script>
</body></html>
